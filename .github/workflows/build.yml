name: Build combined images

on:
  push:
    branches: [uart-backend]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags so git describe versions the build

      - name: Resolve version from git
        run: |
          VER=$(git describe --tags --always)
          echo "VER=$VER" >> $GITHUB_ENV
          echo "Version: $VER"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        # pinned to the version used for local builds — newer cores change
        # build behaviour/layout
        run: pip install "platformio==6.1.19"

      # Artifacts are copied out immediately after each build: a later pio
      # invocation can decide the environment is outdated and clean the
      # build dir, deleting the previous step's binaries.
      - name: Build firmware (both targets)
        run: |
          pio run -e release -e release-t2can
          mkdir -p out/release out/release-t2can
          cp .pio/build/release/bootloader.bin .pio/build/release/partitions.bin .pio/build/release/firmware.bin out/release/
          cp .pio/build/release-t2can/bootloader.bin .pio/build/release-t2can/partitions.bin .pio/build/release-t2can/firmware.bin out/release-t2can/

      - name: Build filesystems
        run: |
          pio run -e release -t buildfs
          pio run -e release-t2can -t buildfs
          cp .pio/build/release/spiffs.bin out/release/
          cp .pio/build/release-t2can/spiffs.bin out/release-t2can/

      - name: List build outputs
        run: find out -name '*.bin' | sort

      - name: Merge combined images
        run: |
          ESPTOOL=~/.platformio/packages/tool-esptoolpy/esptool.py
          BOOT_APP0=~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin
          python "$ESPTOOL" --chip esp32 merge_bin -o "esp32-web-interface_${VER}-0x000.bin" \
            0x1000   out/release/bootloader.bin \
            0x8000   out/release/partitions.bin \
            0xe000   "$BOOT_APP0" \
            0x10000  out/release/firmware.bin \
            0x290000 out/release/spiffs.bin
          python "$ESPTOOL" --chip esp32s3 merge_bin -o "esp32-web-interface-t2can_${VER}-0x000.bin" \
            0x0      out/release-t2can/bootloader.bin \
            0x8000   out/release-t2can/partitions.bin \
            0xe000   "$BOOT_APP0" \
            0x10000  out/release-t2can/firmware.bin \
            0xc90000 out/release-t2can/spiffs.bin
          ls -la esp32-web-interface*.bin

      # Note: Actions artifacts always download as zips (GitHub limitation) —
      # raw .bin downloads come from release assets on v* tags
      - name: Upload ESP32 image
        uses: actions/upload-artifact@v4
        with:
          name: esp32-web-interface_${{ env.VER }}-0x000
          path: esp32-web-interface_${{ env.VER }}-0x000.bin
          retention-days: 30

      - name: Upload T-2Can image
        uses: actions/upload-artifact@v4
        with:
          name: esp32-web-interface-t2can_${{ env.VER }}-0x000
          path: esp32-web-interface-t2can_${{ env.VER }}-0x000.bin
          retention-days: 30

      - name: Attach images to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            esp32-web-interface_${{ env.VER }}-0x000.bin
            esp32-web-interface-t2can_${{ env.VER }}-0x000.bin
