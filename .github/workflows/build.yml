name: Build combined images

on:
  push:
    branches: [uart-backend]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        # pinned to the version used for local builds — newer cores change
        # build behaviour/layout
        run: pip install "platformio==6.1.19"

      - name: Build firmware (both targets)
        run: pio run -e release -e release-t2can

      - name: Build filesystems
        run: |
          pio run -e release -t buildfs
          pio run -e release-t2can -t buildfs

      - name: List build outputs
        run: find .pio/build -maxdepth 2 -name '*.bin' | sort

      - name: Merge combined images
        run: |
          ESPTOOL=~/.platformio/packages/tool-esptoolpy/esptool.py
          BOOT_APP0=~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin
          python "$ESPTOOL" --chip esp32 merge_bin -o esp32-web-interface_4.00-0x000.bin \
            0x1000   .pio/build/release/bootloader.bin \
            0x8000   .pio/build/release/partitions.bin \
            0xe000   "$BOOT_APP0" \
            0x10000  .pio/build/release/firmware.bin \
            0x290000 .pio/build/release/spiffs.bin
          python "$ESPTOOL" --chip esp32s3 merge_bin -o esp32-web-interface-t2can_4.00-0x000.bin \
            0x0      .pio/build/release-t2can/bootloader.bin \
            0x8000   .pio/build/release-t2can/partitions.bin \
            0xe000   "$BOOT_APP0" \
            0x10000  .pio/build/release-t2can/firmware.bin \
            0xc90000 .pio/build/release-t2can/spiffs.bin
          ls -la esp32-web-interface*.bin

      - name: Upload images as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: combined-images-${{ github.sha }}
          path: |
            esp32-web-interface_4.00-0x000.bin
            esp32-web-interface-t2can_4.00-0x000.bin

      - name: Attach images to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            esp32-web-interface_4.00-0x000.bin
            esp32-web-interface-t2can_4.00-0x000.bin
