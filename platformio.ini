; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = Web interface for Huebner inverter
default_envs = release
src_dir = .
data_dir = data
extra_configs = platformio-local-override.ini
boards_dir = boards

[common]
monitor_speed = 115200

[env]
platform = espressif32@~6.13.0
framework = arduino
platform_packages = platformio/tool-esptoolpy
board = esp32dev
board_build.filesystem = spiffs
board_build.flash_mode = qout
build_src_filter = +<*> -<.git/> -<.svn/> -<src/flashloader>
upload_speed = 921600

[env:release]
build_flags = 
	${env.build_flags}
	-D RELEASE
build_type = release
lib_deps = 
	fbiego/ESP32Time@^2.0.0
	adafruit/RTClib@^2.1.1
	SPI

[env:debug]
build_flags = 
	${env.build_flags}
	-D DEBUG
	-DDEBUG_ESP_PORT=Serial
	-DDEBUG_ESP_CORE
	-DDEBUG_ESP_WIFI
build_type = debug
lib_deps = 
	fbiego/ESP32Time@^2.0.0
	adafruit/RTClib@^2.1.1
	SPI

; --- ESP32-S3 targets ---

; Release build for LILYGO T-2Can (ESP32-S3) — SD_MMC disabled (S3 crash bug)
[env:release-t2can]
board = esp32s3_t2can
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.filesystem = spiffs
monitor_speed = 115200
build_flags = 
	${env.build_flags}
	-D RELEASE
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D DBG_OUTPUT_PORT=Serial
	-D S3_SKIP_SD_MMC
build_type = release
lib_deps = 
	fbiego/ESP32Time@^2.0.0
	adafruit/RTClib@^2.1.1
	SPI

[env:debug-t2can]
board = esp32s3_t2can
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.filesystem = spiffs
monitor_speed = 115200
build_flags = 
	${env.build_flags}
	-D DEBUG
	-D DEBUG_ESP_PORT=Serial
	-D DEBUG_ESP_CORE
	-D DEBUG_ESP_WIFI
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D S3_SKIP_SD_MMC
build_type = debug
lib_deps = 
	fbiego/ESP32Time@^2.0.0
	adafruit/RTClib@^2.1.1
	SPI

